name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: Windows x64
            goos: windows
            goarch: amd64
            artifact: claude-portable-windows-x64.exe
          - name: Windows arm64
            goos: windows
            goarch: arm64
            artifact: claude-portable-windows-arm64.exe
          - name: Linux x64
            goos: linux
            goarch: amd64
            artifact: claude-portable-linux-x64
          - name: Linux arm64
            goos: linux
            goarch: arm64
            artifact: claude-portable-linux-arm64
          - name: macOS x64
            goos: darwin
            goarch: amd64
            artifact: claude-portable-macos-x64
          - name: macOS arm64 (Apple Silicon)
            goos: darwin
            goarch: arm64
            artifact: claude-portable-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -o ${{ matrix.artifact }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
